name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (example: 5.0.1.3)"
        required: true
        type: string
      title:
        description: "Release title (optional)"
        required: false
        type: string
      notes:
        description: "Release notes (optional)"
        required: false
        type: string

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write   # Push the version-bump commit and tag, then create the release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # Needed for tag creation and pushing

      - name: Validate version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'branch') {
            Write-Error "This workflow must be run against a branch (got '$env:GITHUB_REF_TYPE')."
            exit 1
          }

          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+(\.\d+){0,2}$') {
            Write-Error "Invalid version '$env:RELEASE_VERSION'. Expected a numeric version such as 5.0.1.3."
            exit 1
          }

      - name: Bump version in csproj and commit
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          $projPath = "CreamInstaller/CreamInstaller.csproj"
          # Read/write through .NET so the file's UTF-8 BOM and line endings are
          # preserved - this keeps the diff limited to the version line.
          $encoding = [System.Text.UTF8Encoding]::new($true)
          $content = [System.IO.File]::ReadAllText($projPath)

          if ($content -notmatch '<Version>[^<]*</Version>') {
            Write-Error "Could not find a <Version> element in $projPath."
            exit 1
          }

          $updated = $content -replace '<Version>[^<]*</Version>', "<Version>$env:RELEASE_VERSION</Version>"
          if ($updated -eq $content) {
            Write-Host "$projPath is already at version $env:RELEASE_VERSION; nothing to commit."
            exit 0
          }

          [System.IO.File]::WriteAllText($projPath, $updated, $encoding)

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add $projPath
          # [skip ci] prevents the bump commit from triggering the CI Builds /
          # pre-release workflows - a release commit does not need a CI build.
          git commit -m "Release v$env:RELEASE_VERSION [skip ci]"
          # Push to the branch the workflow was dispatched on so the tag and the
          # release point at a commit that already contains the new version.
          git push origin "HEAD:$env:BRANCH"

      - name: Create and push tag
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $tag = "v$env:RELEASE_VERSION"

          if (git rev-parse -q --verify "refs/tags/$tag") {
            Write-Error "Tag $tag already exists. Bump the version or delete the existing tag before re-running."
            exit 1
          }

          Write-Host "Creating tag $tag"
          git tag $tag
          git push origin $tag

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore CreamInstaller.sln

      - name: Build Release
        run: dotnet build CreamInstaller.sln --configuration Release --no-restore

      - name: Publish single-file
        # Pin the informational version to the release version and omit the source
        # revision so the released EXE reports a clean "5.0.1.3" instead of
        # "5.0.1.3+<short-sha>". Version input is validated to be numeric-only above.
        run: dotnet publish CreamInstaller.sln -c Release -r win-x64 -p:PublishSingleFile=true --self-contained true --output ./publish -p:InformationalVersion=${{ inputs.version }} -p:IncludeSourceRevisionInInformationalVersion=false

      - name: Zip Release
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./publish/CreamInstaller.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: ${{ inputs.title || format('Release v{0}', inputs.version) }}
          body: ${{ inputs.notes }}
          generate_release_notes: true
          files: |
            ./publish/CreamInstaller.exe
            ./publish/CreamInstaller.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
