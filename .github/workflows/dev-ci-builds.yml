name: Dev CI Builds

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore CreamInstaller.sln

      - name: Build Release
        run: dotnet build CreamInstaller.sln --configuration Release --no-restore

      - name: Derive CI version
        id: version
        shell: pwsh
        run: |
          # Read base version from csproj
          $projPath = "CreamInstaller/CreamInstaller.csproj"
          $xml = [xml](Get-Content $projPath -Raw)
          $baseVersion = $xml.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $baseVersion) {
            Write-Error "Could not read Version from $projPath"
            exit 1
          }
          # Compute the short sha into a variable first: PowerShell does not expand
          # method calls inside an interpolated string, so
          # "shortSha=$env:GITHUB_SHA.Substring(0,7)" would emit the literal text
          # ".Substring(0,7)" instead of the 7-char sha.
          $shortSha = $env:GITHUB_SHA.Substring(0,7)
          # CI builds are versioned "<Version>-CI<runNumber>-<shortSha>" so the title bar,
          # the file properties and everything else in the app shows that it is a CI build.
          $ciVersion = "$baseVersion-CI${{ github.run_number }}-$shortSha"
          Write-Output "baseVersion=$baseVersion" >> $env:GITHUB_OUTPUT
          Write-Output "ciVersion=$ciVersion" >> $env:GITHUB_OUTPUT
          Write-Output "shortSha=$shortSha" >> $env:GITHUB_ENV
          Write-Output "runNumber=${{ github.run_number }}" >> $env:GITHUB_ENV
          Write-Output "branch=$env:GITHUB_REF_NAME" >> $env:GITHUB_ENV

      - name: Publish single-file
        run: dotnet publish CreamInstaller.sln -c Release -r win-x64 -p:PublishSingleFile=true --self-contained true --output ./publish -p:InformationalVersion=${{ steps.version.outputs.ciVersion }} -p:IncludeSourceRevisionInInformationalVersion=false

      - name: Write version.txt
        shell: pwsh
        run: |
          $ciVersion = "${{ steps.version.outputs.ciVersion }}"
          Set-Content -Path ./publish/version.txt -Value $ciVersion -NoNewline

      - name: Rename EXE with run number and short commit SHA
        shell: pwsh
        run: |
          Rename-Item -Path ./publish/CreamInstaller.exe -NewName "CreamInstaller-CI${env:runNumber}-${env:shortSha}.exe"

      - name: Zip release
        shell: pwsh
        run: |
          # Sources are listed explicitly instead of globbing ./publish/* so the archive
          # can never end up containing itself.
          Compress-Archive -Path "./publish/CreamInstaller-CI${env:runNumber}-${env:shortSha}.exe", './publish/version.txt' -DestinationPath "./publish/CreamInstaller-CI${env:runNumber}-${env:shortSha}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: CreamInstaller-CI${{ env.runNumber }}-${{ env.shortSha }}-${{ env.branch }}
          path: |
            ./publish/CreamInstaller-CI${{ env.runNumber }}-${{ env.shortSha }}.exe
            ./publish/CreamInstaller-CI${{ env.runNumber }}-${{ env.shortSha }}.zip
            ./publish/version.txt
